<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        @charset "UTF-8";
        body {
            font-family:Arial, Helvetica, sans-serif Arial;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        a::after {
            content: ' ⇐ ';
        }

        a::before {
            content: ' ⇒ ';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul type="square">
        <li><a href="https://github.com/lorenzobraga333-cpu" target="_blank" rel="external">Repositório GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/lorenzo-braga-dev" target="_blank" rel="external">LinkedIn</a></li>
    </ul>
</body>
</html>
