<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Grow e Flex-Shrink</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row nowrap;
            background-color: lightskyblue;
        }

        div.item {
            flex-basis: 250px;
            flex-shrink: 1;
            flex-grow: 1;
            text-align: center;
            background-color: lightcyan;
            border: 1px solid black;
        }

        div#cxA {
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#cxB {
            flex-shrink: 4;
            flex-grow: 1;
        }

        div#cxC {
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
