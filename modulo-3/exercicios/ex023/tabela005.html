<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colunas com Colgroup</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            margin: auto;
            width: 400px;
        }

        caption {
            font-size: 1.3em;
            padding: 20px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .cnome {
            background-color: chartreuse;
        }

        .cgrupo {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </th>
        </thead>
        <tbody>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Lorenzo</td>
                <td>M</td>
                <td>18</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Fabiano</td>
                <td>M</td>
                <td>49</td>
                <td>Comercial</td>
            </tr>
            <tr>
                <td>Viviane</td>
                <td>F</td>
                <td>50</td>
                <td>Vendedora</td>
            </tr>
            <tr>
                <td>Lucas</td>
                <td>M</td>
                <td>35</td>
                <td>Vendedor</td>
            </tr>
            <tr>
                <td>Vitória</td>
                <td>F</td>
                <td>18</td>
                <td>Manicure</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
