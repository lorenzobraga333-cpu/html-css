<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em <strong>HTML5</strong>, podemos inserir os elementos da lista a seguir. Passe o mouse sob os termos para descobrir qual tag deverá utilizar em cada uso.</p>
    <ul type="square">
        <li><abbr title="Use a tag <p>"><em>Parágrafos</em></abbr></li>
        <li><abbr title="Use a tag <h1>"><em>Títulos</em></abbr></li>
        <li><abbr title="Use a tag <img"><em>Imagens</em></abbr></li>
        <li><abbr title="Use a tag <abbr>"><em>Abreviações</em></abbr></li>
        <li><abbr title="Use a tag <code>"><em>Códigos-fonte</em></abbr></li>
        <li><abbr title="Use a tag OL"><em>Listas numeradas</em></abbr></li>
        <li><abbr title="Use a tag UL"><em>Listas com demarcadores</em></abbr></li>
    </ul>
</body>
</html>
