<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização Absoluta com Flexbox</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: lightblue;
        }

        main {
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
            background-color: lightpink;
            height: 100vh;
            width: 100vw;
        }

        main > section {
            height: 200px;
            width: 200px;
            padding: 10px;
            text-align: center;
            margin: 10px;
        }

        section#item1 {
            background-color: lightgreen;
        }

        section#item2 {
            background-color: aliceblue;
        }

    </style>
</head>
<body>
    <main>
        <section id="item1">
            <h1>Tela de Login</h1>
        </section>
        <section id="item2">
            <h1>Tela de Login 2</h1>
        </section>
    </main>
</body>
</html>
